name: Validate and merge Claude changes

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Claude branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Create or find pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(gh pr list \
            --head "${GITHUB_REF_NAME}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "${PR_NUMBER}" ]; then
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "Merge ${GITHUB_REF_NAME}" \
              --body "Automatically created after the production build passed."

            PR_NUMBER="$(gh pr view \
              "${GITHUB_REF_NAME}" \
              --json number \
              --jq '.number')"
          fi

          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --squash \
            --delete-branch
