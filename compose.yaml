services:
  rolloff:
    build:
      context: .
      args:
        # Set by deploy/auto-update.sh before each rebuild so the running app can show
        # what commit/time it was actually built from. Manual `docker compose up --build`
        # without exporting these first just falls back to "dev".
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: rolloff-tracker
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.rolloff.rule=Host(`rolloff.dark-horse.site`)
      - traefik.http.routers.rolloff.entrypoints=websecure
      - traefik.http.routers.rolloff.tls=true
      - traefik.http.services.rolloff.loadbalancer.server.port=3000
      - traefik.docker.network=proxy
      - traefik.http.routers.rolloff.tls.certresolver=cloudflare
networks:
  proxy:
    external: true
